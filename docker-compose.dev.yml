# Optional fallback database for the finance module. Not a deployment artifact.
#
# The default DSN targets a locally installed PostgreSQL on 55432. This publishes on
# 55433 so bringing the container up can never shadow that server; point the dev host
# at it explicitly:
#     python -m devhost --dsn postgresql://bambo:bambo@127.0.0.1:55433/bambo_finance
services:
  finance-db:
    image: postgres:16-alpine
    container_name: bambo-finance-dev-db
    environment:
      POSTGRES_USER: bambo
      POSTGRES_PASSWORD: bambo
      POSTGRES_DB: bambo_finance
    ports:
      # Bound to loopback on purpose. Publishing without an address listens on every
      # interface, which on a machine with a VPN up means the database answers on the
      # tunnel address too - with these development credentials.
      - "127.0.0.1:55433:5432"
    volumes:
      - finance-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambo -d bambo_finance"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  finance-dev-data:
