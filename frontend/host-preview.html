<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>پیش‌نمایش اتصال | مالی در پوستهٔ بامبو</title>
  <link rel="stylesheet" href="./src/shared/styles/index.css">

  <!--
    A development harness, not a shipped page.

    It reproduces the BAMBO shell around the finance mount so the module can be
    looked at and measured where it will actually live: a top bar, a sidebar,
    and `main.app-main` holding the mount. Everything below is the host's, and
    every number is marked either MEASURED — taken from the real page's computed
    styles — or ASSUMED, where the value has not been supplied yet and the
    control strip lets it be changed on the spot.
  -->
  <style>
    /* MEASURED — main.app-main, computed on the live projects page:
       padding 24px / 16px / 48px, margin 0, max-width none, border-box. */
    :root {
      --hp-main-pad-block-start: 24px;
      --hp-main-pad-inline: 16px;
      --hp-main-pad-block-end: 48px;

      /* ASSUMED — the sidebar's two widths and the top bar's height have not
         been measured yet. The strip at the bottom changes them live. */
      --hp-sidebar: 240px;
      --hp-topbar: 56px;
    }

    /* MEASURED — the host's own body box. This is the answer that matters most:
       the page scrolls, and nothing gives the mount a definite height. */
    body.app-page {
      margin: 0;
      min-block-size: 100dvh;
      block-size: auto;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--color-surface-page);
      color: var(--color-text-primary);
      font-family: var(--font-fa), system-ui, sans-serif;
    }

    .hp-topbar {
      position: sticky;
      inset-block-start: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: .75rem;
      block-size: var(--hp-topbar);
      padding-inline: 1rem;
      border-block-end: 1px solid var(--color-border);
      background: var(--color-surface-header, #0f1830);
      font-size: .8rem;
    }

    .hp-topbar__spacer { flex: 1 1 auto; }

    .hp-sidebar {
      position: fixed;
      inset-block: 0;
      inset-inline-start: 0;
      z-index: 40;
      inline-size: var(--hp-sidebar);
      padding: 1rem .75rem;
      border-inline-end: 1px solid var(--color-border);
      background: var(--color-surface-panel, #0d1526);
      font-size: .78rem;
      transition: inline-size .2s ease;
    }

    .hp-sidebar b { display: block; margin-block-end: .8rem; color: var(--brand-teal); }
    .hp-sidebar span { display: block; padding-block: .35rem; color: var(--color-text-muted); }

    /* The host offsets its content for the sidebar. Which element carries the
       offset — body or main — has not been confirmed; main is the safer guess
       because `main.app-main` measured margin 0 on the real page. */
    body.has-sidebar .hp-main {
      padding-inline-start: calc(var(--hp-main-pad-inline) + var(--hp-sidebar));
    }

    .hp-main {
      padding:
        var(--hp-main-pad-block-start)
        var(--hp-main-pad-inline)
        var(--hp-main-pad-block-end);
      box-sizing: border-box;
    }

    /* --- the strip, which is the harness and not the host ----------------- */

    .hp-probe {
      position: fixed;
      inset-block-end: 0;
      inset-inline: 0;
      z-index: 9000;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .4rem 1rem;
      padding: .45rem .8rem;
      border-block-start: 1px solid var(--color-border);
      background: rgb(8 14 26 / 94%);
      color: #cfd8e6;
      font: 500 11px/1.5 var(--font-fa), system-ui, sans-serif;
      backdrop-filter: blur(6px);
    }

    .hp-probe button {
      padding: .2rem .5rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .hp-probe b { color: #eaf1fb; font-variant-numeric: tabular-nums; }
    .hp-probe .hp-bad { color: #f0a13a; }
    .hp-probe .hp-ok { color: #35d18a; }
    .hp-probe__sep { opacity: .35; }
  </style>
</head>
<body class="app-page has-sidebar" data-finance-runtime="standalone">
  <header class="hp-topbar">
    <span>جستجو…</span>
    <span class="hp-topbar__spacer"></span>
    <span>یکشنبه، ۱۵ شهریور ۱۴۰۵</span>
    <span>◐</span>
    <span>پیمان مصلی</span>
  </header>

  <aside class="hp-sidebar" aria-label="ناوبری میزبان (شبیه‌سازی)">
    <b>بامبو</b>
    <span>داشبورد</span>
    <span>سازمان</span>
    <span>پروژه‌ها</span>
    <span>کنترل پروژه</span>
    <span>گزارش پیشرفت</span>
    <span>امور مالی</span>
    <span>گزارش مالی</span>
  </aside>

  <main class="hp-main app-main">
    <div id="finance-live-region" class="sr-only" role="status" aria-live="polite"></div>
    <div id="finance-module-root" tabindex="-1"></div>
  </main>

  <div class="hp-probe" dir="rtl">
    <span>سایدبار
      <button type="button" data-sb="240">۲۴۰</button>
      <button type="button" data-sb="72">۷۲ (جمع‌شده)</button>
      <button type="button" data-sb="0">۰ (روی محتوا)</button>
    </span>
    <span class="hp-probe__sep">|</span>
    <span>پنجره <b id="hp-win">—</b></span>
    <span>فضای ماژول <b id="hp-mount">—</b></span>
    <span class="hp-probe__sep">|</span>
    <span>محدوده‌ای که ماژول انتخاب کرده <b id="hp-picked">—</b></span>
    <span>محدودهٔ درست برای عرضش <b id="hp-should">—</b></span>
    <span id="hp-verdict"></span>
  </div>

  <noscript>برای اجرای ماژول مالی، JavaScript مرورگر باید فعال باشد.</noscript>
  <script type="module" src="./src/app/bootstrap.js"></script>

  <script>
    /*
      bootstrap picks its adapters from `window.__BAMBO_FINANCE_CONTEXT__`: with
      one it goes to the API and needs a backend; without one it uses the mock
      data this page is here to show. It also writes the runtime marker from the
      same test.

      So the marker is flipped to "host" after the module has rendered. The data
      stays mock and the CSS behaves the way it will once mounted, which is the
      whole point of the page. Nothing here reflects how the real host boots.
    */
    const RANGES = [
      [1281, Infinity, "دسکتاپ (۱۲۸۱+)"],
      [1025, 1280, "۱۰۲۵–۱۲۸۰"],
      [769, 1024, "۷۶۹–۱۰۲۴"],
      [577, 768, "۵۷۷–۷۶۸"],
      [481, 576, "۴۸۱–۵۷۶"],
      [0, 480, "۴۸۰ و پایین‌تر"],
    ];
    const nameFor = (w) => (RANGES.find(([lo, hi]) => w >= lo && w <= hi) || [, , "—"])[2];

    function refresh() {
      const mount = document.getElementById("finance-module-root");
      if (!mount) return;
      const box = mount.getBoundingClientRect();
      const avail = Math.round(box.width);
      document.getElementById("hp-win").textContent = innerWidth + "×" + innerHeight;
      document.getElementById("hp-mount").textContent = avail + "×" + Math.round(box.height);

      // The queries read the window; the module actually has `avail`.
      const picked = nameFor(innerWidth);
      const should = nameFor(avail);
      document.getElementById("hp-picked").textContent = picked;
      document.getElementById("hp-should").textContent = should;
      const verdict = document.getElementById("hp-verdict");
      const same = picked === should;
      verdict.className = same ? "hp-ok" : "hp-bad";
      verdict.textContent = same
        ? "✓ یکی است"
        : "✗ ماژول محدودهٔ اشتباه را انتخاب کرده — " + (innerWidth - avail) + "px از عرضش را میزبان برداشته";
    }

    document.querySelectorAll("[data-sb]").forEach((b) => {
      b.addEventListener("click", () => {
        document.documentElement.style.setProperty("--hp-sidebar", b.dataset.sb + "px");
        setTimeout(refresh, 260);
      });
    });

    addEventListener("resize", refresh);
    const start = Date.now();
    const tick = setInterval(() => {
      const board = document.querySelector(".finance-board");
      if (board) {
        document.body.dataset.financeRuntime = "host";
        refresh();
        clearInterval(tick);
      } else if (Date.now() - start > 15000) {
        clearInterval(tick);
      }
    }, 120);
    new ResizeObserver(refresh).observe(document.getElementById("finance-module-root"));
  </script>
</body>
</html>
