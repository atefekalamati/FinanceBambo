<!doctype html>
<!-- The page ground is painted inline so the first frame is already dark: the
     stylesheet paints it too, but a link element is fetched before it applies,
     and until then the browser shows its own white canvas.

     It reads the token with the literal only as a fallback. Before the
     stylesheet arrives the custom property is undefined and the literal paints;
     after it arrives the property resolves, so switching to the light theme
     repaints this ground with it instead of leaving a dark frame around a light
     board. A bare literal here cannot follow a theme, and inline styles win
     over every stylesheet rule, so it would have been the one colour on the
     page no theme could change. -->
<html lang="fa" dir="rtl" data-theme="dark" style="background:var(--color-surface-page,#0a1120)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>مالی | BAMBO</title>
  <link rel="icon" type="image/svg+xml" href="./public/assets/images/Logo Sign.svg">
  <link rel="stylesheet" href="./src/shared/styles/index.css">
</head>
<body data-finance-runtime="standalone" style="background:var(--color-surface-page,#0a1120)">
  <div id="finance-app" class="app-shell">
    <section class="app-workspace">
      <main id="finance-module-root" tabindex="-1"></main>
    </section>
  </div>
  <noscript>برای اجرای ماژول مالی، JavaScript مرورگر باید فعال باشد.</noscript>
  <script type="module" src="./src/app/bootstrap.js"></script>
</body>
</html>
